<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Form Lamaran — Data Diri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1a1c}a:hover{color:#000}
input::placeholder{color:#8a8083}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #faf8f6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1f1a1c; display: flex; flex-direction: column; position: relative">
<header style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 18px; border-bottom: 1px solid #ece7e4; background: #ffffff">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Kembali ke lowongan" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #ece7e4; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f1a1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 12px; color: #6f6669; font-weight: 600">Melamar sebagai</span>
<span style="font-size: 15.5px; font-weight: 700">Staf Admin</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600"><span>Data Diri</span><span style="color: #6f6669">Langkah 1 dari 3</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<div style="height: 5px; border-radius: 999px; background: #111111"></div>
<div style="height: 5px; border-radius: 999px; background: #e4e0de"></div>
<div style="height: 5px; border-radius: 999px; background: #e4e0de"></div>
</div>
</div>
</header>

<form style="display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 130px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 21px; font-weight: 800">Kenalan dulu, yuk</h1>
<p style="margin: 0; font-size: 13.5px; color: #6f6669; line-height: 1.5">Data ini dipakai tim SAMAQU untuk menghubungi kamu.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 7px">
<label for="nama" style="font-size: 13.5px; font-weight: 600">Nama lengkap <span style="color: #c53030">*</span></label>
<input id="nama" type="text" placeholder="Sesuai KTP" style="height: 50px; box-sizing: border-box; border: 1px solid #ddd5d1; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1f1a1c; background: #ffffff">
</div>

<div style="display: flex; flex-direction: column; gap: 7px">
<label for="wa" style="font-size: 13.5px; font-weight: 600">Nomor WhatsApp <span style="color: #c53030">*</span></label>
<div style="display: flex; height: 50px; box-sizing: border-box; border: 1px solid #ddd5d1; border-radius: 12px; background: #ffffff; overflow: hidden">
<span style="display: flex; align-items: center; padding: 0 12px; background: #f2f0ef; border-right: 1px solid #ddd5d1; font-size: 15px; font-weight: 600">+62</span>
<input id="wa" type="tel" inputmode="numeric" placeholder="812 3456 7890" style="flex: 1; min-width: 0; border: 0; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1f1a1c; background: transparent">
</div>
<span style="font-size: 12.5px; color: #6f6669">Kabar seleksi dikirim lewat nomor ini</span>
</div>

<div style="display: flex; flex-direction: column; gap: 7px">
<label for="email" style="font-size: 13.5px; font-weight: 600">Email <span style="color: #c53030">*</span></label>
<input id="email" type="email" placeholder="nama@email.com" style="height: 50px; box-sizing: border-box; border: 1px solid #ddd5d1; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1f1a1c; background: #ffffff">
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 7px">
<label for="lahir" style="font-size: 13.5px; font-weight: 600">Tanggal lahir <span style="color: #c53030">*</span></label>
<input id="lahir" type="text" placeholder="DD/MM/YYYY" style="height: 50px; box-sizing: border-box; border: 1px solid #ddd5d1; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1f1a1c; background: #ffffff; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 7px">
<label for="kota" style="font-size: 13.5px; font-weight: 600">Domisili <span style="color: #c53030">*</span></label>
<input id="kota" type="text" placeholder="Kota" style="height: 50px; box-sizing: border-box; border: 1px solid #ddd5d1; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1f1a1c; background: #ffffff; min-width: 0">
</div>
</div>

<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px">
<legend style="font-size: 13.5px; font-weight: 600; padding: 0; margin-bottom: 9px">Pendidikan terakhir <span style="color: #c53030">*</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="false" style="height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #ddd5d1; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; color: #1f1a1c">SMP</button>
<button type="button" aria-pressed="true" style="height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #111111; background: #111111; font-family: inherit; font-size: 14px; font-weight: 600; color: #ffffff">SMA/SMK</button>
<button type="button" aria-pressed="false" style="height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #ddd5d1; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; color: #1f1a1c">D3</button>
<button type="button" aria-pressed="false" style="height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #ddd5d1; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; color: #1f1a1c">S1</button>
<button type="button" aria-pressed="false" style="height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #ddd5d1; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; color: #1f1a1c">Lainnya</button>
</div>
</fieldset>
</form>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 22px; background: #ffffff; border-top: 1px solid #ece7e4; display: flex; flex-direction: column; gap: 8px">
<a href="Step2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #111111; color: #ffffff; font-size: 15.5px; font-weight: 700; text-decoration: none">Lanjut</a>
<span style="text-align: center; font-size: 12px; color: #6f6669">Isian tersimpan otomatis di HP kamu</span>
</div>
</div>
</x-dc>

</body>
</html>
